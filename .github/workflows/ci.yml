name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.04 = GNOME 46 / GLib 2.80 (oldest supported), 26.04 = GNOME 50.
        ubuntu: ["24.04", "26.04"]
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            make gjs dbus-daemon libglib2.0-bin gnupg

      - name: Show tested runtime versions
        run: |
          gjs --version
          dpkg-query -W gir1.2-glib-2.0

      - name: Build package and smoke-test over D-Bus
        run: make check

      - name: Check package dependencies resolve
        run: apt-get install --simulate ./build/vscode-search-provider_$(cat VERSION)_all.deb

      - uses: actions/upload-artifact@v4
        if: matrix.ubuntu == '24.04'
        with:
          name: deb
          path: build/*.deb
